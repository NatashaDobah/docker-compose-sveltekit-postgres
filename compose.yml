services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "postgres://${POSTGRES_USER:-guestbook}:${POSTGRES_PASSWORD:-guestbook_pw}@db:5432/${POSTGRES_DB:-guestbook}"
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-guestbook}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-guestbook_pw}"
      POSTGRES_DB: "${POSTGRES_DB:-guestbook}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
